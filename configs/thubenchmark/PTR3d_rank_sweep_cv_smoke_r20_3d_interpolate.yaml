model: PTR_3d_rank_sweep_cv
strategy: 3d_interpolate
lr: 0.008

num_iterations: 40
max_batch_size: 262144

seed: 42

stage: 4
payload_position: first_core
iterations_for_upsampling:
  - 10
  - 20
  - 30

max_rank: 20
rank_sweep_candidates:
  - 15
  - 20
rank_sweep_cv_iterations: 4
rank_sweep_mask_fraction: 0.125
rank_sweep_mask_blocks: 8
rank_sweep_one_se_multiplier: 1.0
rank_sweep_seed: 42

lr_decay_factor: 0.9
lr_decay_factor_until_next_upsampling: 0.1
warmup_steps: 1

loss_fn_str: L2
regularization_weight: 0.0
